name = "contracts"
version = "0.2.2"
description = "The contracts the services of vailaya-stack are written against."
keywords = ["math"]
defaultTargets = ["Contracts"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.1"

[[lean_lib]]
name = "Contracts"
srcDir = "src"
globs = ["Contracts.*"] # every file under src/Contracts/, imported by the root or not
