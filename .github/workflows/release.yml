name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  # Tags main `v<version>`, the tag services pin, unless that version is released already,
  # and tells the services so they open their upgrade pull requests at once.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Tag the release
        id: tag
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("lakefile.toml", "rb"))["version"])')"
          if git rev-parse --verify --quiet "refs/tags/v${version}" >/dev/null; then
            echo "v${version} is already released"
          else
            git tag "v${version}"
            git push origin "v${version}"
            echo "created=true" >> "${GITHUB_OUTPUT}"
          fi

      # This workflow's own token reaches no other repository; the org's app reaches all
      # of them.
      - name: Get the app's token
        id: app
        if: steps.tag.outputs.created == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Tell the services
        if: steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          for service in min-service sort-service; do
            gh api "repos/${GITHUB_REPOSITORY_OWNER}/${service}/dispatches" -f event_type=contracts-released
          done
