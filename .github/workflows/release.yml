name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  # Tags main `v<version>`, the tag services pin, unless that version is released already.
  release:
    runs-on: ubuntu-latest
    env:
      DISPATCH_TOKEN: ${{ secrets.SERVICES_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Tag the release
        id: tag
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("lakefile.toml", "rb"))["version"])')"
          if git rev-parse --verify --quiet "refs/tags/v${version}" >/dev/null; then
            echo "v${version} is already released"
          else
            git tag "v${version}"
            git push origin "v${version}"
            echo "created=true" >> "${GITHUB_OUTPUT}"
          fi

      # Optional. This workflow's own token reaches no other repository; with a secret
      # SERVICES_DISPATCH_TOKEN that can write to the services, their upgrade starts now
      # instead of at their next hourly check.
      - name: Tell the services
        if: steps.tag.outputs.created == 'true' && env.DISPATCH_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.DISPATCH_TOKEN }}
        run: |
          for service in min-service sort-service; do
            gh api "repos/${GITHUB_REPOSITORY_OWNER}/${service}/dispatches" -f event_type=contracts-released
          done
